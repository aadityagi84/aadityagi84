<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 376" width="1200" height="376" role="img" aria-label="Credentials: Frontend Developer (React) from HackerRank; Introduction to Node.js (LFW111) from The Linux Foundation; React.js and Node.js from The Digital Adda; MERN Stack Development from DUCAT IT Training. Education: BCA, Chaudhary Charan Singh University, Meerut, 2022 to 2025."><style>
