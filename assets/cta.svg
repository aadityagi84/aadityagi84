<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Let's build something great. Full-stack roles, AI integrations and products worth shipping."><style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style><defs><linearGradient id="cb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".17"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient>
<radialGradient id="sh" cx="0" cy="0" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><g transform="translate(0 0)"><rect width="1200" height="190" rx="24" fill="#0F0F12"/><defs><clipPath id="cc"><rect width="1200" height="190" rx="24"/></clipPath><filter id="cbl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="70"/></filter><linearGradient id="ct" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff"/><stop offset="1" stop-color="#C6FF3D"/></linearGradient></defs><g clip-path="url(#cc)" filter="url(#cbl)"><circle cx="1000" cy="190" r="150" fill="#4338CA" fill-opacity=".6"><animate attributeName="cx" values="1000;860;1000" dur="16s" repeatCount="indefinite"/></circle><circle cx="1150" cy="20" r="110" fill="#0D9488" fill-opacity=".5"><animate attributeName="cy" values="20;90;20" dur="13s" repeatCount="indefinite"/></circle></g><rect width="1200" height="190" rx="24" fill="url(#sh)"/><rect x=".5" y=".5" width="1199" height="189" rx="23.5" fill="none" stroke="url(#cb)"/><text class="m" x="40" y="56" font-size="13" fill="#63636B" letter-spacing="2">NEXT</text><text class="s" x="38" y="116" font-size="50" font-weight="800" letter-spacing="-2" fill="url(#ct)">Let’s build something great.</text><text class="s" x="40" y="152" font-size="18" fill="#A1A1AA">Full-stack roles, AI integrations and products worth shipping.</text></g></svg>
