    <circle cx="1120" cy="330" r="170" fill="#0D9488" fill-opacity=".6"><animate attributeName="cx" values="1120;1000;1150;1120" dur="27s" repeatCount="indefinite"/><animate attributeName="cy" values="330;260;380;330" dur="27s" repeatCount="indefinite"/></circle>
